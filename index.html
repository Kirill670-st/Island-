<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Остров</title>
<meta name="apple-mobile-web-app-title" content="Остров">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d5566;
    font-family: -apple-system, "Trebuchet MS", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 64px;
    pointer-events: none;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    background: rgba(255, 244, 214, .93); color: #3b2a14; border-radius: 999px;
    padding: 5px 11px; font-size: 15px; font-weight: 700;
  }
  .pill[hidden] { display: none; }

  .bars { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; width: 150px; }
  .bar { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .bar .track { flex: 1; height: 10px; border-radius: 6px; background: rgba(0, 0, 0, .38); overflow: hidden; }
  .bar .fill { height: 100%; width: 100%; border-radius: 6px; }
  .hp .fill { background: #e0533f; }
  .food .fill { background: #e0a23a; }
  .o2 .fill { background: #5cc8f0; }
  body:not([data-scene="dive"]) .o2 { display: none; }

  .goal {
    margin-top: 9px; color: #fff; font-size: 14px; line-height: 1.35; max-width: 290px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
  }

  #jbase, #jknob {
    position: fixed; display: none; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #jbase { width: 110px; height: 110px; background: rgba(255, 255, 255, .16); border: 2px solid rgba(255, 255, 255, .4); }
  #jknob { width: 46px; height: 46px; background: rgba(255, 255, 255, .55); }

  .act {
    position: fixed; border: 0; font-family: inherit; font-weight: 800; display: none;
    color: #2b1d0a; -webkit-tap-highlight-color: transparent;
  }
  .rect { border-radius: 18px; padding: 14px 22px; font-size: 18px; }
  #craftBtn { display: block; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); background: #e2b04a; box-shadow: 0 3px 0 #a67a22; }
  #diveBtn, #mineBtn, #upBtn, #landBtn, #talkBtn { right: 16px; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 70px); }
  #sailBtn { right: 16px; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 124px); background: #7fb6e8; box-shadow: 0 3px 0 #4a82b6; }
  #diveBtn { background: #5cc8f0; box-shadow: 0 3px 0 #2f8fb3; }
  #mineBtn { background: #c9a26a; box-shadow: 0 3px 0 #8f6e3d; }
  #upBtn { background: #f3ead2; box-shadow: 0 3px 0 #b9ad92; }
  #landBtn { background: #c9e08a; box-shadow: 0 3px 0 #8fa856; }
  #talkBtn { background: #ffd447; box-shadow: 0 3px 0 #b8952a; }
  body.canDive[data-scene="island"] #diveBtn { display: block; }
  body.canMine[data-scene="island"] #mineBtn { display: block; }
  body.canSail[data-scene="island"] #sailBtn { display: block; }
  body.nearNpc[data-scene="island"] #talkBtn { display: block; }
  body.nearLadder[data-scene="mine"] #upBtn { display: block; }
  body.canLand[data-scene="sea"] #landBtn { display: block; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 116px); }
  #holdBtn { right: 16px; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 170px); background: #c9b28a; box-shadow: 0 3px 0 #8f7a54; }
  body.hasShip[data-scene="sea"] #holdBtn { display: block; }
  body[data-scene="sea"] #attackBtn { display: block; }
  body[data-scene="sea"] #craftBtn { display: none; }

  #attackBtn {
    right: 16px; bottom: max(24px, env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%; font-size: 19px;
    background: #e2604a; color: #fff; box-shadow: 0 4px 0 #a03826;
  }
  #surfBtn { right: 16px; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 116px); background: #f3ead2; box-shadow: 0 3px 0 #b9ad92; }
  body[data-scene="dive"] #attackBtn, body[data-scene="dive"] #surfBtn { display: block; }
  body.armed[data-scene="island"] #attackBtn { display: block; }
  body[data-scene="dive"] #craftBtn { display: none; }
  body.armed[data-scene="island"] #craftBtn { bottom: calc(max(24px, env(safe-area-inset-bottom)) + 116px); }
  body.armed[data-scene="island"] #diveBtn, body.armed[data-scene="island"] #talkBtn { bottom: calc(max(20px, env(safe-area-inset-bottom)) + 186px); }
  body.armed[data-scene="island"] #sailBtn { bottom: calc(max(20px, env(safe-area-inset-bottom)) + 240px); }

  #eatBtn { left: 16px; bottom: max(20px, env(safe-area-inset-bottom)); background: #8fd07a; box-shadow: 0 3px 0 #5b9a48; }
  body.hasFood #eatBtn { display: block; }
  .act:active { transform: translateY(2px); }

  .overlay {
    position: fixed; inset: 0; background: rgba(6, 30, 38, .55);
    display: flex; align-items: center; justify-content: center;
  }
  .overlay[hidden] { display: none; }
  .panel {
    background: #fff4d6; color: #3b2a14; border-radius: 22px; padding: 20px;
    width: min(88vw, 360px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  .panel h2 { margin: 0 0 12px; font-size: 22px; }
  .panel p { margin: 0 0 12px; font-size: 16px; line-height: 1.4; }
  .recipe { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .recipe + .recipe { margin-top: 16px; }
  .recipe .name { font-size: 18px; font-weight: 800; }
  .recipe .need, .dneed { font-size: 14px; margin-top: 4px; color: #6b5535; }
  .dneed { margin: 0 0 12px; line-height: 1.5; }
  .lack { color: #b3402a; font-weight: 700; }
  .panel button {
    font-family: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 14px;
    padding: 11px 16px; background: #3f8f5a; color: #fff;
  }
  .panel button:disabled { background: #b9ad92; color: #f3ead2; }
  .panel .close { display: block; margin: 16px auto 0; background: transparent; color: #6b5535; }

  #actBtn { right: 16px; bottom: calc(max(20px, env(safe-area-inset-bottom)) + 124px); background: #9be37a; box-shadow: 0 3px 0 #62a044; }
  body.hasAct[data-scene="island"] #actBtn, body.hasAct[data-scene="home"] #actBtn { display: block; }
  #menuBtn { display: block; top: max(12px, env(safe-area-inset-top)); right: 12px; padding: 6px 14px; font-size: 20px; border-radius: 999px; background: rgba(255, 244, 214, .93); box-shadow: none; }
  .crow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; font-size: 16px; }
  .crow.head { font-size: 13px; color: #6b5535; }
  .crow button { padding: 6px 12px; margin-left: 4px; }
  .panel textarea { width: 100%; box-sizing: border-box; height: 90px; margin: 10px 0; border-radius: 10px; border: 2px solid #d8c69a; padding: 8px; font-size: 12px; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .panel textarea[hidden], .panel button[hidden] { display: none; }
  #heroBtn { display: block; top: calc(max(12px, env(safe-area-inset-top)) + 46px); right: 12px; padding: 6px 12px; font-size: 15px; border-radius: 999px; background: rgba(255, 244, 214, .93); box-shadow: none; }
  .xp .fill { background: #a78bfa; }
  .xpbar { height: 10px; border-radius: 6px; background: #e3d5a8; overflow: hidden; margin-bottom: 10px; }
  .xpbar i { display: block; height: 100%; background: #8b5cf6; }
  .crow small { color: #6b5535; font-size: 13px; }
  #bagBtn { display: block; top: calc(max(12px, env(safe-area-inset-top)) + 92px); right: 12px; padding: 6px 12px; font-size: 15px; border-radius: 999px; background: rgba(255, 244, 214, .93); box-shadow: none; }
  #envPill { background: rgba(20, 30, 50, .72); color: #fff; }
  .panel h3 { font-size: 15px; color: #6b5535; }
  #toast {
    position: fixed; left: 50%; bottom: 26%; transform: translateX(-50%);
    background: rgba(20, 20, 20, .78); color: #fff; padding: 10px 16px; border-radius: 14px;
    font-size: 15px; max-width: 78vw; text-align: center; opacity: 0;
    transition: opacity .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #fade { position: fixed; inset: 0; background: #06222c; opacity: 0; pointer-events: none; transition: opacity .35s; }
  #hurt { position: fixed; inset: 0; background: rgba(200, 30, 30, .5); opacity: 0; pointer-events: none; }
</style>
</head>
<body data-scene="island">
<canvas id="c"></canvas>

<div class="hud">
  <div class="pills">
    <div class="pill" id="envPill">☀️ День</div>
    <div class="pill">🪵 <span id="nStick">0</span></div>
    <div class="pill">🪨 <span id="nStone">0</span></div>
    <div class="pill">🐟 <span id="nFish">0</span></div>
    <div class="pill" id="pillMeat" hidden>🥩 <span id="nMeat">0</span></div>
    <div class="pill" id="pillVeg" hidden>🥕 <span id="nVeg">0</span></div>
    <div class="pill" id="pillSeed" hidden>🌱 <span id="nSeed">0</span></div>
    <div class="pill" id="spearPill" hidden></div>
    <div class="pill" id="pickPill" hidden></div>
    <div class="pill" id="boatPill" hidden>⛵ Лодка</div>
    <div class="pill" id="infPill" hidden>🧟 Заражение</div>
    <div class="pill" id="chillPill" hidden>❄️ Холод</div>
    <div class="pill" id="perkPill" hidden></div>
  </div>
  <div class="bars">
    <div class="bar hp">❤️<div class="track"><div class="fill" id="hpFill"></div></div></div>

</div>

<div id="jbase"></div><div id="jknob"></div>

<button class="act rect" id="craftBtn">Крафт</button>

<button class="act rect" id="mineBtn">Копать вниз</button>
<button class="act rect" id="upBtn">Наверх</button>
<button class="act rect" id="sailBtn">В море</button>
<button class="act rect" id="landBtn">Высадиться</button>
<button class="act rect" id="talkBtn">Говорить</button>

<div class="overlay" id="overlay" hidden>
  <div class="panel">
    <h2>Крафт</h2>
    <div id="recipes"></div>
    <button class="close" id="closeBtn">Закрыть</button>
  </div>
</div>

<div class="overlay" id="dialog" hidden>
  <div class="panel">
    <h2 id="dName"></h2>
    <p id="dText"></p>
    <div class="dneed" id="dNeed"></div>
    <button id="dTurn">Сдать</button>
    <button class="close" id="dClose">Закрыть</button>
  </div>
</div>

<div class="overlay" id="chestUI" hidden>
  <div class="panel">
    <h2 id="chestTitle">Сундук</h2>
    <div id="chestRows"></div>
    <button class="close" id="chestClose">Закрыть</button>
  </div>
</div>

<div class="overlay" id="furnaceUI" hidden>
  <div class="panel">
    <h2>Печь</h2>
    <div id="furnaceRows"></div>
    <button class="close" id="furnaceClose">Закрыть</button>
  </div>
</div>

<div class="overlay" id="bagUI" hidden>
  <div class="panel">
    <h2>Сумка</h2>
    <div id="bagRows"></div>
    <button class="close" id="bagClose">Закрыть</button>

</div>

<div class="overlay" id="heroUI" hidden>
  <div class="panel">
    <h2>Герой</h2>
    <div id="heroRows"></div>
    <button class="close" id="heroClose">Закрыть</button>
  </div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="panel">
    <h2>Меню</h2>
    <p id="saveStatus"></p>
    <div class="row">
      <button id="saveNow">Сохранить</button>
      <button id="showCode">Код сохранения</button>
      <button id="openLoad">Загрузить код</button>
    </div>
    <textarea id="codeBox" hidden placeholder="Вставьте код сюда"></textarea>
    <button id="applyCode" hidden>Применить код</button>
    <button class="close" id="newGame">Новая игра</button>
    <button class="close" id="menuClose">Закрыть</button>
  </div>
</div>

<div id="toast"></div>
<div id="hurt"></div>
<div id="fade"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
  }
  addEventListener('resize', resize); resize();

  // ---------- helpers ----------
  let seed = 20260929;
  function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function angDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return d;
  }
  const far = (x, y, arr, d) => arr.every(o => Math.hypot(o.x - x, o.y - y) > d);
  function hash(tx, ty, k) {
    let n = (tx * 374761393 + ty * 668265263 + k * 2147483647) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function path(pts) {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
  }

  // ---------- tiers & perks ----------
  const NAMES = ['', 'камень', 'медь', 'железо'];
  const TIER_COL = ['', '#b0b5ba', '#d98b45', '#eef2f5'];
  const PERKS = {
    lung:  { title: 'Трубка для дыхания (+20 с воздуха)', emoji: '🫁' },
    smoke: { title: 'Копчёная рыба (голод растёт медленнее)', emoji: '🍗' },
    armor: { title: 'Кожаная броня (урон вдвое меньше)', emoji: '🛡️' },
    crown: { title: 'Корона скелетов (урон +2)', emoji: '👑' },
    ward: { title: 'Магический щит (урон меньше на 15%)', emoji: '🔮' },
    cure: { title: 'Иммунитет (заражение не действует)', emoji: '💉' },
    warm: { title: 'Тёплый плащ (холод не действует)', emoji: '🧣' }
  };
  const perks = { lung: false, smoke: false, armor: false, crown: false, ward: false, cure: false, warm: false };
  let O2MAX = 40;
  let HUNGER = 0.35;

  // ---------- state ----------
  let scene = 'island';   // 'island' | 'dive' | 'mine' | 'sea'
  let busy = false;
  const p = { x: 0, y: 30, aim: 0, atk: 0, cd: 0, inv: 0 };
  const cam = { x: 0, y: 30 };
  const inv = { stick: 0, stone: 0, fish: 0, meat: 0, veg: 0, seed: 0, copper: 0, iron: 0, gold: 0, spear: 0, pick: 0, boat: 0, hoe: 0, house: 0, ship: 0, arm: 0, am: 0, coal: 0, silver: 0, cuBar: 0, feBar: 0, agBar: 0, auBar: 0 };
  const stats = { hp: 100, food: 100, o2: 40 };
  let caught = false;
  let face = 1, moving = false;
  const SPEED = 160;
  let savedPos = { x: 0, y: 30 };
  let floats = [];
  const HX = -170, HY = -40, CHX = -90, CHY = -22, FX = 80, FY = 110;
  let restAt = 0;
  const hero = { level: 1, xp: 0, pts: 0, vit: 0, str: 0, agi: 0, end: 0 };
  const MAXLV = 20;
  const XPMINE = { 2: 1, 3: 3, 4: 5, 6: 8, 7: 2, 8: 7 };
  function xpNeed(L) { return 40 + 25 * (L - 1); }
  function maxHp() { return 100 + hero.vit * 12; }
  function strBonus() { return Math.floor(hero.str / 2) + (perks.crown ? 2 : 0); }
  const bossDown = {};
  let arrows = [];
  let zones = [];
  const isBoss = a => a.type === 'boss' || a.type === 'archmage' || a.type === 'rotlord' || a.type === 'queen';
  let equip = 0;   // 0 none, 1 bronze, 2 silver, 3 anti-magic
  let infect = 0;
  let chill = 0;
  const bossDownN = {};
  // ---------- time of day & weather ----------
  const DAY_LEN = 600;
  let dayT = .12, dayNo = 1, weather = 'clear', wxT = 150;
  function nightLevel() {
    const d = dayT;
    if (d < .55) return 0;
    if (d < .65) return (d - .55) / .1;
    if (d < .88) return 1;
    if (d < .97) return 1 - (d - .88) / .09;
    return 0;
  }
  function isNight() { return nightLevel() > .5; }
  function phaseName() { return dayT < .55 ? 'День' : dayT < .65 ? 'Вечер' : dayT < .9 ? 'Ночь' : 'Рассвет'; }
  function phaseIcon() { const n = phaseName(); return n === 'День' ? '☀️' : n === 'Вечер' ? '🌆' : n === 'Ночь' ? '🌙' : '🌅'; }
  function envMult() { return weather === 'rain' ? 1.15 : weather === 'snow' ? .8 : 1; }
  function advanceEnv(dt) {
    dayT += dt / DAY_LEN;
    if (dayT >= 1) { dayT -= 1; dayNo++; }
    wxT -= dt;
    if (wxT <= 0) {
      const r = rnd(), nw = r < .5 ? 'clear' : r < .78 ? 'rain' : 'snow';
      wxT = 150 + rnd() * 150;
      if (nw !== weather) {
        weather = nw;
        if (scene === 'island' || scene === 'sea') {
          toast(nw === 'rain' ? 'Начался дождь: на суше ходить быстрее, грядки растут быстрее.'
            : nw === 'snow' ? 'Пошёл снег: идти тяжелее, голод растёт быстрее.' : 'Погода прояснилась.');
        }
      }
    }
  }
  function armorMult(magic) { if (equip === 1) return .85; if (equip === 2) return .70; if (equip === 3) return magic ? .35 : .85; return 1; }
  function armorCol() { return equip === 1 ? '#b98a55' : equip === 2 ? '#d3dae2' : equip === 3 ? '#8a6cff' : (perks.armor ? '#b98a55' : '#e8e0c8'); }
  function spd() { return 1 + hero.agi * .03; }
  function recalc() {
    O2MAX = 40 + (perks.lung ? 20 : 0) + hero.end * 4;
    HUNGER = (perks.smoke ? .2 : .35) * (1 - Math.min(.5, hero.end * .03));
  }
  function gainXp(n) {
    if (hero.level >= MAXLV) return;
    hero.xp += n;
    while (hero.level < MAXLV && hero.xp >= xpNeed(hero.level)) {
      hero.xp -= xpNeed(hero.level); hero.level++; hero.pts += 3;
      stats.hp = maxHp();
      toast('Уровень ' + hero.level + '! +3 очка героя (кнопка ⭐)');
    }
    if (hero.level >= MAXLV) hero.xp = 0;
    updateHud();
  }

  function hurt(n, magic) {
    const v = Math.max(1, Math.round(n * (perks.armor ? .5 : 1) * (perks.ward ? .85 : 1) * armorMult(magic) * (1 - Math.min(.5, hero.vit * .015))));
    stats.hp -= v;
    return v;
  }

  // ---------- islands ----------
  const NPC_DEFS = {
    gavrila: {
      name: 'Рыбак Гаврила', col: '#c9553a', hat: '#e8d7a0', x: 40, y: 25,
      doneText: 'Спасибо тебе, друг! Заданий пока нет, но ты всегда желанный гость.',
      quests: [
        { text: 'Ох, я тут совсем оголодал. Принеси 6 рыб, и я тебя отблагодарю.', need: { fish: 6 }, reward: { auBar: 1, stick: 4 } },
        { text: 'Хочу починить сети. Нужны 8 камней и 4 медных слитка. Взамен дам трубку для ныряния.', need: { stone: 8, cuBar: 4 }, perk: 'lung' },
        { text: 'Принеси 4 железных и 2 золотых слитка, и я сделаю тебе запас копчёной рыбы.', need: { feBar: 4, auBar: 2 }, perk: 'smoke' }
      ]
    },
    nia: {
      name: 'Путешественница Ния', col: '#3f7fbf', hat: '#7a3f2a', x: -30, y: 35,
      doneText: 'Ты настоящий выживший! Пока у меня всё, но море большое.',
      quests: [

          if (a.tt <= 0) { a.tt = 1 + rnd() * 2; a.tang = rnd() * 7; a.idle = rnd() < .3; }
          sp = a.idle ? 0 : a.speed;
        }
        const dc = Math.hypot(a.x, a.y);
        if (dc > isl.radiusAt(a.x, a.y) - 45) { a.tang = Math.atan2(-a.y, -a.x); if (a.chasing && dp > 40) { /* stay on land */ } sp = Math.max(sp, a.speed); }
        if (isl.npc) {
          const nx = a.x - isl.npc.x, ny = a.y - isl.npc.y, nd = Math.hypot(nx, ny);
          if (nd < 100) { a.tang = Math.atan2(ny, nx); sp = a.chase; a.chasing = false; }
        }
        a.ang += angDiff(a.tang, a.ang) * Math.min(1, dt * 6);
        let mx = (Math.cos(a.ang) * sp + a.vx) * dt, my = (Math.sin(a.ang) * sp + a.vy) * dt;
        const nx2 = a.x + mx, ny2 = a.y + my;
        if (Math.hypot(nx2, ny2) < isl.radiusAt(nx2, ny2) - 30) { a.x = nx2; a.y = ny2; }
        for (const t of (a.ghostly ? [] : isl.trees)) {
          const tx = a.x - t.x, ty = a.y - t.y, td = Math.hypot(tx, ty), m = 22 + a.r * .5;
          if (td < m && td > 0) { a.x = t.x + tx / td * m; a.y = t.y + ty / td * m; }
        }
        const damp = Math.max(0, 1 - dt * 6);
        a.vx *= damp; a.vy *= damp;
        if (dp < a.r + 14 && a.cd <= 0 && p.inv <= 0 && (!a.ghostly || a.solid)) {
          a.cd = isBoss(a) ? 1.8 : 1.2; p.inv = .8;
          if (a.infects && !perks.cure) { if (infect <= 0) toast('Вас заразили! Съешьте овощи, чтобы вылечиться.'); infect = Math.max(infect, 10); }
          if (a.chills && !perks.warm) { if (chill <= 0) toast('Вас сковал холод!'); chill = Math.max(chill, 5); }
          const v = hurt(a.dmg);
          floats.push({ x: p.x, y: p.y - 40, txt: '-' + v, life: 1 });
          hurtFlash();
        }
      }
    }
    bossSyncT -= dt; if (bossSyncT <= 0) { bossSyncT = 1; syncBosses(isl); }
    updateSkelAI(dt);
    updateFloats(dt);

    const dist = Math.hypot(p.x, p.y), rr = isl.radiusAt(p.x, p.y);
    document.body.classList.toggle('canDive', inv.spear > 0 && dist > rr + 12);
    document.body.classList.toggle('canSail', inv.boat > 0 && dist > rr + 12);
    document.body.classList.toggle('canMine', inv.pick > 0 && !!MINE_ORES[isl.id] && dist < rr - 20);
    document.body.classList.toggle('armed', isl.danger && inv.spear > 0);
    document.body.classList.toggle('nearNpc', !!isl.npc && Math.hypot(p.x - isl.npc.x, p.y - isl.npc.y) < 75);
    stats.o2 = Math.min(O2MAX, stats.o2 + dt * 20);
    cam.x += (p.x - cam.x) * Math.min(1, dt * 6);
    cam.y += (p.y - cam.y) * Math.min(1, dt * 6);
  }

  // ---------- sea update ----------
  function updateSea(dt, t) {
    const { vx, vy, len } = readInput();
    const bs = (inv.ship ? 300 : BSPEED) * (weather === 'snow' ? .9 : 1);
    boat.vx += (vx * bs - boat.vx) * Math.min(1, dt * 1.6);
    boat.vy += (vy * bs - boat.vy) * Math.min(1, dt * 1.6);
    if (len > .08) boat.ang += angDiff(Math.atan2(vy, vx), boat.ang) * Math.min(1, dt * 4);
    boat.x += boat.vx * dt; boat.y += boat.vy * dt;
    const bd = Math.hypot(boat.x, boat.y);
    if (bd > SEA_R) { boat.x *= SEA_R / bd; boat.y *= SEA_R / bd; }
    landTarget = null;
    for (const I of islands) {
      const dx = boat.x - I.cx, dy = boat.y - I.cy, d = Math.hypot(dx, dy) || 1;
      const lim = I.radiusAt(dx, dy) + 70;
      if (d < lim) {
        const nx = dx / d, ny = dy / d;
        boat.x = I.cx + nx * lim; boat.y = I.cy + ny * lim;
        const vn = boat.vx * nx + boat.vy * ny;
        if (vn < 0) { boat.vx -= vn * nx; boat.vy -= vn * ny; }
      }
      if (d < I.radiusAt(dx, dy) + 140) landTarget = I;
      if (!I.discovered && d < I.maxR + 600) { I.discovered = true; toast('Вы заметили: ' + I.name); gainXp(15); }
    }
    updateSeaMobs(dt, t);
    document.body.classList.toggle('hasShip', !!inv.ship);
    document.body.classList.toggle('canLand', !!landTarget);
    const lt = landTarget && hero.level < landTarget.minLevel ? 'Нужен ур. ' + landTarget.minLevel : 'Высадиться';
    if ($('landBtn').textContent !== lt) $('landBtn').textContent = lt;
    stats.o2 = O2MAX;
    cam.x += (boat.x - cam.x) * Math.min(1, dt * 5);
    cam.y += (boat.y - cam.y) * Math.min(1, dt * 5);
  }

  // ---------- dive update ----------
  let lastO2Hint = 0, lastFoodHint = 0;
  function updateDive(dt, t) {
    const { vx, vy, len } = readInput();
    const ds = DSPEED * spd();
    diver.vx += (vx * ds - diver.vx) * Math.min(1, dt * 5);
    diver.vy += (vy * ds - diver.vy) * Math.min(1, dt * 5);
    if (len > .08) diver.aim = Math.atan2(vy, vx);
    diver.x += diver.vx * dt; diver.y += diver.vy * dt;
    const dc = Math.hypot(diver.x, diver.y);
    if (dc > ARENA) { diver.x *= ARENA / dc; diver.y *= ARENA / dc; }
    diver.cd -= dt; diver.atk -= dt; diver.inv -= dt;

    stats.o2 -= dt;
    if (stats.o2 <= 0) {
      stats.o2 = 0; stats.hp -= 12 * dt;
      if (t - lastO2Hint > 3) { lastO2Hint = t; toast('Не хватает воздуха! Жмите «Всплыть».'); hurtFlash(); }
    }

    bubT -= dt;
    if (bubT <= 0) { bubT = .35; bubbles.push({ x: diver.x + (rnd() - .5) * 10, y: diver.y + (rnd() - .5) * 10, r: 2.5, life: 1.2 }); }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i]; b.life -= dt; b.r += dt * 4; b.y -= dt * 10;
      if (b.life <= 0) bubbles.splice(i, 1);
    }
    updateFloats(dt);

    for (const c of creatures) {
      c.tt -= dt; c.hitT = Math.max(0, c.hitT - dt); c.fl = Math.max(0, c.fl - dt);
      const dxp = diver.x - c.x, dyp = diver.y - c.y, dp = Math.hypot(dxp, dyp);
      let sp = c.speed;
      if (c.tt <= 0) { c.tt = 1 + rnd() * 2.5; c.tang += (rnd() - .5) * 2.4; }
      if (c.type === 'small' && dp < 150) { c.tang = Math.atan2(-dyp, -dxp); sp *= 2.4; }
      if (c.fl > 0) { c.tang = Math.atan2(-dyp, -dxp); sp *= 2.6; }
      if (c.type === 'jelly') sp = c.speed * (.15 + .85 * Math.abs(Math.sin(t * 2 + c.ph)));
      if (Math.hypot(c.x, c.y) > ARENA - 30) c.tang = Math.atan2(-c.y, -c.x);
      c.ang += angDiff(c.tang, c.ang) * Math.min(1, dt * 5);
      c.x += (Math.cos(c.ang) * sp + c.vx) * dt;
      c.y += (Math.sin(c.ang) * sp + c.vy) * dt;
      const damp = Math.max(0, 1 - dt * 6);
      c.vx *= damp; c.vy *= damp;
      if (c.type === 'jelly' && dp < c.r + 12 && diver.inv <= 0) {
        diver.inv = 1;
        const v = hurt(10);
        floats.push({ x: diver.x, y: diver.y - 20, txt: '-' + v, life: 1 });
        hurtFlash();
      }
    }

    const cnt = type => creatures.reduce((n, c) => n + (c.type === type), 0);
    for (const type of Object.keys(TARGET)) {
      if (cnt(type) < TARGET[type]) {
        spawnT[type] += dt;
        if (spawnT[type] >= EVERY[type]) { spawnT[type] = 0; const c = makeCreature(type); if (c) creatures.push(c); }
      } else spawnT[type] = 0;
    }

    cam.x += (diver.x - cam.x) * Math.min(1, dt * 6);
    cam.y += (diver.y - cam.y) * Math.min(1, dt * 6);
  }

  // ---------- mine update ----------
  const DROP = { 2: ['stone', '+1 камень'], 3: ['copper', '+1 медная руда'], 4: ['iron', '+1 железная руда'], 6: ['gold', '+1 золотая руда'], 7: ['coal', '+1 уголь'], 8: ['silver', '+1 серебряная руда'] };
  const DEBRIS_COL = { 1: '#7a5433', 2: '#7c858b', 3: '#d9843f', 4: '#d8b4a0', 6: '#f2cf4a', 7: '#2b2b30', 8: '#dfe6ee' };
  let lastPickHint = 0;
  function mineNeed(type) { return BASE[type] / (1 + .6 * (inv.pick - REQ[type])) / (1 + hero.agi * .04); }
  function breakTile(tx, ty, type) {
    grid[ty * GW + tx] = 0;
    const cx = (tx + .5) * TS, cy = (ty + .5) * TS;
    for (let k = 0; k < 7; k++) {
      const a = rnd() * 7, s = 40 + rnd() * 90;
      debris.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + rnd() * .3, c: DEBRIS_COL[type] });

    if (type === 1) {

    } else if (DROP[type]) {

      floats.push({ x: cx, y: cy - 10, txt: DROP[type][1], life: 1.1 });
      updateHud();
    }
  }
  function updateMine(dt, t) {
    const { vx, vy, len } = readInput();
    miner.moving = len > .08;
    const sp = 135 * spd();
    if (miner.moving) {
      miner.aim = Math.atan2(vy, vx);
      const nx = miner.x + vx * sp * dt;
      if (!collides(nx, miner.y)) miner.x = nx;
      else if (Math.abs(vx) > Math.abs(vy)) {
        const cyc = (Math.floor(miner.y / TS) + .5) * TS;
        if (!solidAt(miner.x + Math.sign(vx) * 16, cyc)) {
          const d = cyc - miner.y, ny = miner.y + Math.sign(d) * Math.min(Math.abs(d), 140 * dt);
          if (!collides(miner.x, ny)) miner.y = ny;
        }
      }
      const ny2 = miner.y + vy * sp * dt;
      if (!collides(miner.x, ny2)) miner.y = ny2;
      else if (Math.abs(vy) >= Math.abs(vx)) {
        const cxc = (Math.floor(miner.x / TS) + .5) * TS;
        if (!solidAt(cxc, miner.y + Math.sign(vy) * 16)) {
          const d = cxc - miner.x, nx2 = miner.x + Math.sign(d) * Math.min(Math.abs(d), 140 * dt);
          if (!collides(nx2, miner.y)) miner.x = nx2;
        }
      }
    }

    let tgt = null;
    if (miner.moving) {
      let dx = 0, dy = 0;
      if (Math.abs(vx) > Math.abs(vy)) dx = Math.sign(vx); else dy = Math.sign(vy);
      const tx = Math.floor((miner.x + dx * 19) / TS), ty = Math.floor((miner.y + dy * 19) / TS);
      const type = tileAt(tx, ty);
      if (type !== 0) tgt = { tx, ty, type };
    }
    miner.mining = false;
    if (tgt) {
      const req = REQ[tgt.type];
      if (inv.pick < req) {
        mineTgt = null; mineProg = 0;
        if (t - lastPickHint > 3) {
          lastPickHint = t;
          toast(tgt.type === 5 ? 'Это основание острова, его не пробить.' : 'Нужна кирка получше.');
        }
      } else {
        if (!mineTgt || mineTgt.tx !== tgt.tx || mineTgt.ty !== tgt.ty) { mineTgt = tgt; mineProg = 0; }
        miner.mining = true;
        mineProg += dt;
        const need = mineNeed(tgt.type);
        if (mineProg >= need) { breakTile(tgt.tx, tgt.ty, tgt.type); mineTgt = null; mineProg = 0; }
      }
    } else { mineTgt = null; mineProg = 0; }

    const mtx = Math.floor(miner.x / TS), mty = Math.floor(miner.y / TS);
    for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
      if (dx * dx + dy * dy <= 21) {
        const x = mtx + dx, y = mty + dy;
        if (x >= 0 && y >= 0 && x < GW && y < GH) seen[y * GW + x] = 1;
      }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i]; d.life -= dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= .92; d.vy *= .92;
      if (d.life <= 0) debris.splice(i, 1);
    }
    updateFloats(dt);

    const lx = (LX + .5) * TS, ly = (LY + .5) * TS;
    document.body.classList.toggle('nearLadder', Math.hypot(miner.x - lx, miner.y - ly) < 75);
    stats.o2 = O2MAX;
    cam.x += (miner.x - cam.x) * Math.min(1, dt * 8);
    cam.y += (miner.y - cam.y) * Math.min(1, dt * 8);
  }

              ['veg', '🥕', 'Овощи'], ['seed', '🌱', 'Семена'],

              ['cuBar', '🟧', 'Медные слитки'], ['feBar', '⬛', 'Железные слитки'], ['agBar', '⬜', 'Серебряные слитки'], ['auBar', '🟨', 'Золотые слитки']];

      restAt = Date.now(); infect = 0; chill = 0;

  // ---------- save / load ----------

    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(f.txt, f.x, f.y);
      ctx.fillStyle = '#fff'; ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- drawing: island ----------
  function drawTree(tr, t) {
    if (tr.dead) { drawDeadTree(tr, t); return; }
    if (tr.crystal) { drawCrystalTree(tr, t); return; }
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(tr.x + 10, tr.y + 4, 26, 9, 0, 0, 7); ctx.fill();
    const sw = Math.sin(t * 1.2 + tr.ph) * 3;
    const tx = tr.x + tr.lean + sw, ty = tr.y - tr.h;
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(tr.x, tr.y);
    ctx.quadraticCurveTo(tr.x + tr.lean * 1.3, tr.y - tr.h * .5, tx, ty); ctx.stroke();
    for (let i = 0; i < 7; i++) {
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(i / 7 * Math.PI * 2 + tr.ph + sw * .01);
      ctx.fillStyle = i % 2 ? '#2f7d3a' : '#43a04c';
      ctx.beginPath(); ctx.ellipse(24, 0, 27, 8, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#5b3a1e'; ctx.beginPath(); ctx.arc(tx, ty, 5, 0, 7); ctx.fill();
  }

  function drawPlayer(t) {
    const bob = moving ? Math.sin(t * 12) * 2 : 0;
    const x = p.x, y = p.y, s = face;
    const inWater = Math.hypot(x, y) > isl.radiusAt(x, y);
    const blink = p.inv > 0 && Math.floor(t * 20) % 2;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 13, 5, 0, 0, 7); ctx.fill();

    if (inv.spear && p.atk <= 0) {
      const hx = x + s * 16, hy = y - 14 + bob;
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx, hy + 22); ctx.lineTo(hx, hy - 34); ctx.stroke();
      ctx.fillStyle = TIER_COL[inv.spear];
      ctx.beginPath(); ctx.moveTo(hx, hy - 48); ctx.lineTo(hx - 4, hy - 33); ctx.lineTo(hx + 4, hy - 33); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#8b6a48'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const leg = moving ? Math.sin(t * 12) * 4 : 0;
    ctx.beginPath(); ctx.moveTo(x - 4, y - 8); ctx.lineTo(x - 4 + leg, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 4, y - 8); ctx.lineTo(x + 4 - leg, y); ctx.stroke();
    ctx.fillStyle = blink ? '#ff9a9a' : armorCol();
    ctx.beginPath(); ctx.ellipse(x, y - 17 + bob, 10, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e2a97c';
    ctx.beginPath(); ctx.arc(x, y - 35 + bob, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(x, y - 37 + bob, 9, Math.PI, 0); ctx.fill();
    if (equip) { ctx.fillStyle = armorCol(); ctx.beginPath(); ctx.arc(x, y - 38 + bob, 9.5, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); }
    ctx.beginPath(); ctx.arc(x, y - 34 + bob, 1.6, 0, 7); ctx.arc(x + s * 4, y - 34 + bob, 1.6, 0, 7); ctx.fill();

    if (p.atk > 0 && inv.spear) {
      const ext = Math.sin((1 - p.atk / .25) * Math.PI);
      ctx.save(); ctx.translate(x, y - 16); ctx.rotate(p.aim);
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(30 + ext * 44, 0); ctx.stroke();
      ctx.fillStyle = TIER_COL[inv.spear];
      ctx.beginPath(); ctx.moveTo(46 + ext * 44, 0); ctx.lineTo(28 + ext * 44, -4.5); ctx.lineTo(28 + ext * 44, 4.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    if (inWater) {
      const k = (t * 1.5) % 1;
      ctx.fillStyle = 'rgba(77,184,180,.6)';
      ctx.beginPath(); ctx.ellipse(x, y - 1, 15, 7, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 - k * .5) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y, 14 + k * 16, 6 + k * 7, 0, 0, 7); ctx.stroke();
    }
  }

  function drawNpc(n, t) {
    const x = n.x, y = n.y, bob = Math.sin(t * 2) * 1.2;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(x, y + 2, 13, 5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6d5238'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 4, y - 8); ctx.lineTo(x - 4, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 4, y - 8); ctx.lineTo(x + 4, y); ctx.stroke();
    ctx.fillStyle = n.col;
    ctx.beginPath(); ctx.ellipse(x, y - 17 + bob, 11, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e2a97c';
    ctx.beginPath(); ctx.arc(x, y - 35 + bob, 9, 0, 7); ctx.fill();
    ctx.fillStyle = n.hat;
    ctx.beginPath(); ctx.ellipse(x, y - 40 + bob, 13, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - 41 + bob, 7, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x - 3, y - 34 + bob, 1.5, 0, 7); ctx.arc(x + 3, y - 34 + bob, 1.5, 0, 7); ctx.fill();
    const q = n.quests[n.stage];
    if (q) {
      ctx.font = 'bold 24px -apple-system, sans-serif'; ctx.textAlign = 'center';
      const yy = y - 62 + Math.sin(t * 3) * 3;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.strokeText(canTurn(q) ? '✓' : '!', x, yy);
      ctx.fillStyle = canTurn(q) ? '#8dff8d' : '#ffd447'; ctx.fillText(canTurn(q) ? '✓' : '!', x, yy);
    }
  }

  function drawAnimal(a, t) {
    if (a.night && isBoss(a)) drawNightAura(a, t);
    if (a.type === 'skeleton' || a.type === 'archer' || a.type === 'boss') { drawSkel(a, t); return; }
    if (a.type === 'mage' || a.type === 'archmage') { drawMage(a, t); return; }
    if (a.type === 'golem') { drawGolem(a, t); return; }
    if (a.type === 'zombie' || a.type === 'runner' || a.type === 'rotlord') { drawZombie(a, t); return; }
    if (a.type === 'ghost' || a.type === 'wraith' || a.type === 'queen') { drawGhost(a, t); return; }
    ctx.save(); ctx.translate(a.x, a.y);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(0, 3, a.r * 1.3, a.r * .5, 0, 0, 7); ctx.fill();
    const dir = Math.cos(a.ang) >= 0 ? 1 : -1;
    ctx.scale(dir, 1);
    const hit = a.hitT > 0;
    const step = Math.sin(t * 12 + a.ph) * (a.chasing ? 3 : 1.5);
    if (a.type === 'boar') {
      const r = a.r;
      ctx.strokeStyle = '#3d2818'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-r * .6, -r * .3); ctx.lineTo(-r * .6 + step, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * .1, -r * .3); ctx.lineTo(-r * .1 - step, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * .5, -r * .3); ctx.lineTo(r * .5 + step, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * .9, -r * .3); ctx.lineTo(r * .9 - step, 0); ctx.stroke();
      ctx.fillStyle = hit ? '#ffffff' : '#7a5136';
      ctx.beginPath(); ctx.ellipse(0, -r * .85, r * 1.15, r * .8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = hit ? '#ffffff' : '#65432b';
      ctx.beginPath(); ctx.ellipse(r * 1.05, -r * .75, r * .6, r * .5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#f2ead8';
      ctx.beginPath(); ctx.moveTo(r * 1.3, -r * .5); ctx.lineTo(r * 1.6, -r * .75); ctx.lineTo(r * 1.15, -r * .6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3d2818';
      ctx.beginPath(); ctx.moveTo(-r * .2, -r * 1.6); ctx.lineTo(r * .1, -r * 1.75); ctx.lineTo(r * .3, -r * 1.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.chasing ? '#ff4a3a' : '#111';
      ctx.beginPath(); ctx.arc(r * 1.05, -r * .95, 2, 0, 7); ctx.fill();
    } else {
      const r = a.r;
      ctx.strokeStyle = '#a53a2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(k * r * .5, -r * .3); ctx.lineTo(k * r * .8 + step * k, 0); ctx.stroke();
      }
      ctx.fillStyle = hit ? '#ffffff' : '#d8503a';
      ctx.beginPath(); ctx.ellipse(0, -r * .6, r, r * .65, 0, 0, 7); ctx.fill();
      ctx.fillStyle = hit ? '#ffffff' : '#e8654d';
      ctx.beginPath(); ctx.arc(-r * 1.1, -r * 1.2 + (a.chasing ? step : 0), r * .45, 0, 7); ctx.arc(r * 1.1, -r * 1.2 - (a.chasing ? step : 0), r * .45, 0, 7); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-r * .3, -r * 1.05, 1.8, 0, 7); ctx.arc(r * .3, -r * 1.05, 1.8, 0, 7); ctx.fill();
    }
    ctx.restore();
    if (a.hp < a.maxhp) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(a.x - 14, a.y - a.r * 2.3 - 8, 28, 4);
      ctx.fillStyle = '#e0533f'; ctx.fillRect(a.x - 14, a.y - a.r * 2.3 - 8, 28 * Math.max(0, a.hp) / a.maxhp, 4);
    }
  }

  function drawItem(it, t) {
    const pulse = .5 + .5 * Math.sin(t * 3 + it.rot * 5);
    ctx.fillStyle = 'rgba(255,255,255,' + (.14 + .14 * pulse) + ')';
    ctx.beginPath(); ctx.arc(it.x, it.y, 15 + pulse * 3, 0, 7); ctx.fill();
    if (it.type === 'stick') {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.strokeStyle = '#7a4d24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
      ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(3, -7); ctx.stroke();
      ctx.restore();
    } else if (it.type === 'gold') {
      ctx.fillStyle = '#f2cf4a';
      ctx.beginPath(); ctx.arc(it.x, it.y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(it.x - 2.5, it.y - 2.5, 2.5, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#8d9296';
      ctx.beginPath(); ctx.ellipse(it.x, it.y, 10, 7, it.rot, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.38)';
      ctx.beginPath(); ctx.ellipse(it.x - 3, it.y - 2, 4, 2.5, it.rot, 0, 7); ctx.fill();
    }
  }

  function drawIsland(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d5566'; ctx.fillRect(0, 0, cv.width, cv.height);
    const Z = applyCamera();
    drawWaves(t, Z, (x, y) => Math.hypot(x, y) < isl.radiusAt(x, y) + 115);
    drawTerrain(isl, t);
    drawFarm(t);
    drawZones(t);
    for (const it of isl.items) drawItem(it, t);

    const list = isl.trees.map(tr => ({ y: tr.y, f: () => drawTree(tr, t) }));
    for (const a of isl.animals) list.push({ y: a.y, f: () => drawAnimal(a, t) });
    if (isl.npc) list.push({ y: isl.npc.y, f: () => drawNpc(isl.npc, t) });
    if (isl.id === 0 && inv.house) list.push({ y: HY, f: drawHouse });
    list.push({ y: p.y, f: () => drawPlayer(t) });
    list.sort((a, b) => a.y - b.y);
    for (const e of list) e.f();
    drawArrows();
    drawFloats();
    if (isl.dark) drawDarkness(Z);
    drawEnv(t, Z, p.x, p.y - 16, isl.dark);
    drawBossBar();
  }

  // ---------- drawing: sea ----------
  function drawBoat(t) {
    ctx.save(); ctx.translate(boat.x, boat.y); ctx.rotate(boat.ang);
    const sp = Math.hypot(boat.vx, boat.vy);
    if (sp > 15) {
      ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(.45, sp / 400) + ')'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(-30, s * 10); ctx.lineTo(-30 - sp * .35, s * (14 + sp * .05)); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(4, 7, 38, 15, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#7a4d24';
    ctx.beginPath(); ctx.moveTo(40, 0); ctx.quadraticCurveTo(26, -18, -26, -16); ctx.lineTo(-33, -9); ctx.lineTo(-33, 9); ctx.lineTo(-26, 16); ctx.quadraticCurveTo(26, 18, 40, 0); ctx.fill();
    ctx.fillStyle = '#b98650';
    ctx.beginPath(); ctx.ellipse(-2, 0, 27, 10, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a4d24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(-6, 9); ctx.moveTo(10, -8); ctx.lineTo(10, 8); ctx.stroke();
    const row = Math.sin(t * 6) * Math.min(1, sp / 120) * .5;
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(-2, s * 8); ctx.lineTo(-10 - row * 12 * s, s * 26); ctx.stroke();
    }
    ctx.fillStyle = '#e2a97c';
    ctx.beginPath(); ctx.arc(-4, 0, 6.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(-5.5, 0, 6.5, Math.PI * .5, Math.PI * 1.5); ctx.fill();
    ctx.restore();
  }

  function drawSea(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d5566'; ctx.fillRect(0, 0, cv.width, cv.height);
    const Z = applyCamera();
    drawWaves(t, Z, (x, y) => islands.some(I => {
      const dx = x - I.cx, dy = y - I.cy;
      return Math.hypot(dx, dy) < I.radiusAt(dx, dy) + 115;
    }));
    const view = Math.max(W, H) / Z;
    for (const I of islands) {
      if (Math.hypot(cam.x - I.cx, cam.y - I.cy) > I.maxR + view) continue;
      ctx.save(); ctx.translate(I.cx, I.cy);
      drawTerrain(I, t);
      for (const tr of I.trees) drawTree(tr, t);
      ctx.restore();
      if (I.discovered && Math.hypot(boat.x - I.cx, boat.y - I.cy) < I.maxR + 700) {
        ctx.font = 'bold 22px -apple-system, sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.5)';
        const lab = I.name + (I.minLevel > 1 ? '  (ур. ' + I.minLevel + '+)' : '');
        ctx.strokeText(lab, I.cx, I.cy - I.maxR + 110);
        ctx.fillStyle = hero.level < I.minLevel ? '#ffb0a0' : '#fff'; ctx.fillText(lab, I.cx, I.cy - I.maxR + 110);
      }
    }
    for (const m of seaMobs) drawSeaMob(m, t);
    if (inv.ship) drawShip(t); else drawBoat(t);
    drawBoatSpear();
    drawBalls();
    drawFloats();
    drawEnv(t, Z, boat.x, boat.y, false);

    // arrows to discovered islands
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const sx = (W / 2 + (boat.x - cam.x) * Z) * DPR, sy = (H / 2 + (boat.y - cam.y) * Z) * DPR;
    for (const m of seaMobs) {
      const dx = m.x - boat.x, dy = m.y - boat.y, d = Math.hypot(dx, dy);
      if (d > 800 || d < 260) continue;
      const a = Math.atan2(dy, dx), r0 = 74 * DPR;
      ctx.save(); ctx.translate(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,70,55,.9)';
      ctx.beginPath(); ctx.moveTo(9 * DPR, 0); ctx.lineTo(-6 * DPR, -6 * DPR); ctx.lineTo(-6 * DPR, 6 * DPR); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    for (const I of islands) {
      if (!I.discovered) continue;
      const dx = I.cx - boat.x, dy = I.cy - boat.y, d = Math.hypot(dx, dy);
      if (d < I.maxR + 500) continue;
      const a = Math.atan2(dy, dx), r0 = 92 * DPR;
      ctx.save(); ctx.translate(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0); ctx.rotate(a);
      ctx.fillStyle = I.id === 0 ? 'rgba(243,234,210,.9)' : 'rgba(255,211,106,.9)';
      ctx.beginPath(); ctx.moveTo(11 * DPR, 0); ctx.lineTo(-7 * DPR, -8 * DPR); ctx.lineTo(-7 * DPR, 8 * DPR); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- drawing: dive ----------
  function drawCreature(c, t) {
    ctx.save(); ctx.translate(c.x, c.y);
    if (c.type === 'jelly') {
      const pul = 1 + .08 * Math.sin(t * 4 + c.ph);
      ctx.strokeStyle = 'rgba(255,170,210,.65)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let j = 0; j < 7; j++) {
        const a = j / 7 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        ctx.beginPath(); ctx.moveTo(ca * c.r * .5, sa * c.r * .5);
        ctx.quadraticCurveTo(ca * c.r * 1.1 + Math.sin(t * 3 + j) * 5, sa * c.r * 1.1 + Math.cos(t * 3 + j) * 5, ca * c.r * 1.7, sa * c.r * 1.7);
        ctx.stroke();
      }
      ctx.fillStyle = c.hitT > 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,140,200,.6)';
      ctx.beginPath(); ctx.arc(0, 0, c.r * pul, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.arc(-c.r * .25, -c.r * .25, c.r * .4, 0, 7); ctx.fill();
    } else {
      ctx.rotate(c.ang);
      const big = c.type === 'big', L = c.r * 1.35, Wd = c.r * .6;
      const sw = Math.sin(t * (c.fl > 0 ? 18 : 8) + c.ph) * .3;
      ctx.save(); ctx.translate(-L * .9, 0); ctx.rotate(sw);
      ctx.fillStyle = big ? '#5d7fa0' : '#e8742a';
      ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-c.r * .9, -c.r * .6); ctx.lineTo(-c.r * .9, c.r * .6); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = c.hitT > 0 ? '#ffffff' : (big ? '#8fb0cf' : '#ff9a3c');
      ctx.beginPath(); ctx.ellipse(0, 0, L, Wd, 0, 0, 7); ctx.fill();
      if (big) {
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.ellipse(0, Wd * .3, L * .75, Wd * .35, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#1b1b1b';
      ctx.beginPath(); ctx.arc(L * .55, -Wd * .35, c.r * .13 + 1, 0, 7); ctx.arc(L * .55, Wd * .35, c.r * .13 + 1, 0, 7); ctx.fill();
    }
    ctx.restore();
    if (c.hp < c.maxhp) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(c.x - 13, c.y - c.r - 16, 26, 4);
      ctx.fillStyle = '#e0533f'; ctx.fillRect(c.x - 13, c.y - c.r - 16, 26 * Math.max(0, c.hp) / c.maxhp, 4);
    }
  }

  function drawDiver(t) {
    ctx.save(); ctx.translate(diver.x, diver.y); ctx.rotate(diver.aim);
    const moving2 = Math.hypot(diver.vx, diver.vy) > 10;
    const kick = Math.sin(t * 10) * (moving2 ? 1 : .3);
    ctx.strokeStyle = '#8b6a48'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-10, -3); ctx.lineTo(-25, -3 + kick * 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10, 3); ctx.lineTo(-25, 3 - kick * 5); ctx.stroke();
    const ext = diver.atk > 0 ? Math.sin((1 - diver.atk / .28) * Math.PI) : 0;
    const tip = 34 + ext * 46;
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8 + ext * 30, 9); ctx.lineTo(tip, 9); ctx.stroke();
    ctx.fillStyle = TIER_COL[Math.max(1, inv.spear)];
    ctx.beginPath(); ctx.moveTo(tip + 12, 9); ctx.lineTo(tip - 2, 5); ctx.lineTo(tip - 2, 13); ctx.closePath(); ctx.fill();
    ctx.fillStyle = (diver.inv > 0 && Math.floor(t * 20) % 2) ? '#ff9a9a' : '#e8e0c8';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e2a97c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(8 + ext * 22, 9); ctx.stroke();
    ctx.fillStyle = '#e2a97c';
    ctx.beginPath(); ctx.arc(13, 0, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath(); ctx.arc(11.5, 0, 7, Math.PI * .5, Math.PI * 1.5); ctx.fill();
    ctx.restore();
  }

  function drawDive(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#04212c'; ctx.fillRect(0, 0, cv.width, cv.height);
    applyCamera();

    ctx.fillStyle = '#0c5a78';
    ctx.beginPath(); ctx.arc(0, 0, ARENA + 40, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(120,195,195,.15)';
    for (const s of deco.sand) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    deco.sand.forEach((s, i) => {
      ctx.beginPath();
      ctx.arc(s.x + Math.sin(t * .5 + i) * 25, s.y + Math.cos(t * .4 + i * 2) * 25, s.r * .55, 0, 7);
      ctx.fill();
    });

    for (const r of deco.rocks) {
      ctx.fillStyle = '#3d6577';
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.rx, r.ry, r.rot, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.beginPath(); ctx.ellipse(r.x - r.rx * .25, r.y - r.ry * .3, r.rx * .45, r.ry * .35, r.rot, 0, 7); ctx.fill();
    }
    for (const c of deco.corals) {
      ctx.fillStyle = c.c;
      for (let j = 0; j < c.n; j++) {
        const a = j / c.n * Math.PI * 2;
        ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * 9, c.y + Math.sin(a) * 9, 6, 0, 7); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(c.x, c.y, 7, 0, 7); ctx.fill();
    }
    for (const w of deco.weeds) {
      for (let j = 0; j < 6; j++) {
        ctx.save(); ctx.translate(w.x, w.y);
        ctx.rotate(j / 6 * Math.PI * 2 + Math.sin(t * 1.3 + w.ph) * .15);
        ctx.fillStyle = j % 2 ? '#2c8f5f' : '#37a56d';
        ctx.beginPath(); ctx.ellipse(14 * w.s, 0, 16 * w.s, 4 * w.s, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
    }

    for (const c of creatures) drawCreature(c, t);
    drawDiver(t);

    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    for (const b of bubbles) {
      ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    drawFloats();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const cx = cv.width / 2, cy = cv.height / 2;
    const g = ctx.createRadialGradient(cx, cy, Math.min(cv.width, cv.height) * .25, cx, cy, Math.max(cv.width, cv.height) * .78);
    g.addColorStop(0, 'rgba(2,20,30,0)'); g.addColorStop(1, 'rgba(2,20,30,.68)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);
    if (stats.o2 < 8) {
      ctx.fillStyle = 'rgba(200,30,30,' + (.08 + .07 * Math.sin(t * 8)) + ')';
      ctx.fillRect(0, 0, cv.width, cv.height);
    }
  }

  // ---------- drawing: mine ----------
  const TILE_COL = { 0: '#33261d', 1: '#7a5433', 2: '#7c858b', 3: '#7c858b', 4: '#7c858b', 5: '#22222b', 6: '#7c858b', 7: '#7c858b', 8: '#7c858b' };
  const ORE_COL = { 3: '#d9843f', 4: '#d8b4a0', 6: '#f2cf4a', 7: '#1b1b20', 8: '#e6edf5' };
  function drawTile(type, tx, ty) {
    const x = tx * TS, y = ty * TS;
    ctx.fillStyle = (type >= 2 && type !== 5) ? STONE_COL[curMine] : TILE_COL[type]; ctx.fillRect(x, y, TS + 1, TS + 1);
    if (type === 0) {
      ctx.fillStyle = 'rgba(0,0,0,.14)';
      for (let k = 0; k < 3; k++) ctx.fillRect(x + hash(tx, ty, k) * (TS - 6), y + hash(tx, ty, k + 9) * (TS - 6), 5, 4);
      return;
    }
    if (type === 1) {
      for (let k = 0; k < 5; k++) {
        ctx.fillStyle = k % 2 ? '#5f3f24' : '#8d6640';
        ctx.fillRect(x + hash(tx, ty, k) * (TS - 8), y + hash(tx, ty, k + 5) * (TS - 8), 6, 5);
      }
    } else if (type === 5) {
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 6, y + 10); ctx.lineTo(x + TS - 10, y + TS - 6); ctx.stroke();
    } else {
      for (let k = 0; k < 3; k++) {
        ctx.fillStyle = k % 2 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.1)';
        ctx.fillRect(x + hash(tx, ty, k) * (TS - 14), y + hash(tx, ty, k + 3) * (TS - 14), 12, 9);
      }
      if (ORE_COL[type]) {
        for (let k = 0; k < 4; k++) {
          const ox = x + 8 + hash(tx, ty, k + 20) * (TS - 16), oy = y + 8 + hash(tx, ty, k + 30) * (TS - 16);
          ctx.fillStyle = ORE_COL[type];
          ctx.beginPath(); ctx.arc(ox, oy, 5 + hash(tx, ty, k + 40) * 3, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.4)';
          ctx.beginPath(); ctx.arc(ox - 1.5, oy - 1.5, 1.8, 0, 7); ctx.fill();
        }
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x, y, TS, 3);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x, y + TS - 3, TS, 3);
  }

  function drawMiner(t) {
    ctx.save(); ctx.translate(miner.x, miner.y); ctx.rotate(miner.aim);
    const kick = miner.moving ? Math.sin(t * 10) : 0;
    ctx.strokeStyle = '#6d5238'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-15, -4 + kick * 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, 4); ctx.lineTo(-15, 4 - kick * 4); ctx.stroke();
    ctx.save(); ctx.translate(6, 9);
    ctx.rotate(miner.mining ? Math.sin(t * 16) * .55 : 0);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(28, 0); ctx.stroke();
    ctx.strokeStyle = TIER_COL[Math.max(1, inv.pick)]; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(26, -10); ctx.quadraticCurveTo(31, 0, 26, 10); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#c9c39c';
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 9, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#e2a97c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(3, 4); ctx.lineTo(8, 9); ctx.stroke();
    ctx.fillStyle = '#e2b93b';
    ctx.beginPath(); ctx.arc(9, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff8c0';
    ctx.beginPath(); ctx.arc(15, 0, 2.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawMine(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    const Z = applyCamera();
    const hw = W / Z / 2 + TS, hh = H / Z / 2 + TS;
    const tx0 = Math.max(0, Math.floor((cam.x - hw) / TS)), tx1 = Math.min(GW - 1, Math.floor((cam.x + hw) / TS));
    const ty0 = Math.max(0, Math.floor((cam.y - hh) / TS)), ty1 = Math.min(GH - 1, Math.floor((cam.y + hh) / TS));
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      if (!seen[ty * GW + tx]) continue;
      drawTile(grid[ty * GW + tx], tx, ty);
    }

    const lx = LX * TS, ly = LY * TS;
    ctx.fillStyle = '#5a3d22'; ctx.fillRect(lx + 10, ly + 2, 5, TS - 4); ctx.fillRect(lx + TS - 15, ly + 2, 5, TS - 4);
    ctx.fillStyle = '#8a5a2b';
    for (let k = 0; k < 4; k++) ctx.fillRect(lx + 10, ly + 6 + k * 10, TS - 20, 4);

    if (mineTgt) {
      const need = mineNeed(mineTgt.type);
      const f = Math.min(1, mineProg / need);
      const x = mineTgt.tx * TS, y = mineTgt.ty * TS;
      ctx.fillStyle = 'rgba(0,0,0,' + (f * .35) + ')'; ctx.fillRect(x, y, TS, TS);
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 2;
      const n = Math.ceil(f * 4);
      for (let k = 0; k < n; k++) {
        const a = hash(mineTgt.tx, mineTgt.ty, k + 60) * 6.28;
        ctx.beginPath(); ctx.moveTo(x + TS / 2, y + TS / 2);
        ctx.lineTo(x + TS / 2 + Math.cos(a) * 20, y + TS / 2 + Math.sin(a) * 20); ctx.stroke();
      }
    }

    drawMiner(t);
    for (const d of debris) {
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life * 2));
      ctx.fillStyle = d.c; ctx.fillRect(d.x - 3, d.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
    drawFloats();

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const sx = (W / 2 + (miner.x - cam.x) * Z) * DPR, sy = (H / 2 + (miner.y - cam.y) * Z) * DPR;
    const rad = 230 * Z * DPR;
    const g = ctx.createRadialGradient(sx, sy, rad * .12, sx, sy, rad);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.22)'); g.addColorStop(1, 'rgba(0,0,0,.84)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

    const dxl = lx + TS / 2 - miner.x, dyl = ly + TS / 2 - miner.y, dl = Math.hypot(dxl, dyl);
    if (dl > 220) {
      const a = Math.atan2(dyl, dxl), r0 = 84 * DPR;
      ctx.save(); ctx.translate(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0); ctx.rotate(a);
      ctx.fillStyle = 'rgba(243,234,210,.85)';
      ctx.beginPath(); ctx.moveTo(10 * DPR, 0); ctx.lineTo(-6 * DPR, -7 * DPR); ctx.lineTo(-6 * DPR, 7 * DPR); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  if (loadLocal()) toast('Прогресс загружен.');

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (!busy) {
      if (scene === 'island') updateIsland(dt, now);
      else if (scene === 'dive') updateDive(dt, t);
      else if (scene === 'mine') updateMine(dt, t);
      else if (scene === 'home') updateHome(dt);
      else updateSea(dt, t);
      updateSurvival(dt, t);
      advanceEnv(dt);
    }
    if (scene === 'island') drawIsland(t);
    else if (scene === 'dive') drawDive(t);
    else if (scene === 'mine') drawMine(t);
    else if (scene === 'home') drawHome(t);
    else drawSea(t);
    if (!$('furnaceUI').hidden && now - lastFurnRender > 450) { lastFurnRender = now; renderFurnace(); }
    const lbl = (scene === 'sea' && inv.ship) ? 'Пушка' : 'Удар';
    if ($('attackBtn').textContent !== lbl) $('attackBtn').textContent = lbl;
    updateBars();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
